<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    position:relative;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.card{
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    animation: float 3s ease-in-out infinite;
    z-index:10;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

h1{
    color:#ff4081;
    font-size:2.5rem;
    margin-bottom:10px;
}

.cake{
    font-size:5rem;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.message{
    margin-top:20px;
    font-size:1.1rem;
    color:#444;
    line-height:1.7;
}

.name{
    color:#ff4081;
    font-weight:bold;
}

.btn{
    margin-top:25px;
    background:#ff4081;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:50px;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#e91e63;
    transform:scale(1.05);
}

.footer{
    margin-top:20px;
    color:#777;
    font-size:0.9rem;
}

@media(max-width:480px){
    h1{
        font-size:2rem;
    }

    .cake{
        font-size:4rem;
    }

    .message{
        font-size:1rem;
    }

    .card{
        padding:25px 20px;
    }
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <p class="message">
        Dear <span class="name">[Name]</span>, ❤️<br><br>
        Wishing you a day filled with happiness, laughter,
        unforgettable memories, and endless joy.
        May all your dreams come true and your year ahead be
        filled with success, love, and wonderful surprises! 🎉✨
    </p>

    <button class="btn" onclick="showWish()">
        Click for Surprise 🎁
    </button>

    <p class="footer">
        Made with ❤️ for your special day
    </p>
</div>

<script>
function showWish(){
    alert("🎉 Happy Birthday! May your day be as amazing as you are! 🎂✨");
}

/* CONFETTI ANIMATION */

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const confetti = [];

const colors = [
    "#ff4081",
    "#ffeb3b",
    "#00e676",
    "#2196f3",
    "#ff5722",
    "#9c27b0"
];

for(let i=0;i<180;i++){
    confetti.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height - canvas.height,
        r: Math.random()*6+3,
        d: Math.random()*180,
        color: colors[Math.floor(Math.random()*colors.length)],
        tilt: Math.random()*10-10
    });
}

function drawConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    confetti.forEach(c=>{
        ctx.beginPath();
        ctx.fillStyle=c.color;
        ctx.fillRect(c.x,c.y,c.r,c.r*1.5);
    });

    updateConfetti();
}

let angle = 0;

function updateConfetti(){
    angle += 0.01;

    confetti.forEach(c=>{
        c.y += (Math.cos(angle + c.d)+3+c.r/2)/2;
        c.x += Math.sin(angle);

        if(c.y > canvas.height){
            c.y = -20;
            c.x = Math.random()*canvas.width;
        }
    });
}

function animate(){
    drawConfetti();
    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
